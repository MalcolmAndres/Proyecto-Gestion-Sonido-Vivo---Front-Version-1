
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encabezados de seguridad
  add_header X-Frame-Options "DENY" always;               # evita que otra página muestre el sitio en un iframe (clickjacking)
  add_header X-Content-Type-Options "nosniff" always;     # el navegador no adivina el tipo de archivo
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
